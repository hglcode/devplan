[package]
name = "devplan"
version = "0.5.2"
edition = "2024"
description = "Project dev plan / todo / done / decision tracker"
license = "MIT"              # 需要 accompanying LICENSE 文件
repository = "https://github.com/hglcode/devplan"
keywords = ["cli", "todo", "planning", "adr"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dp"
path = "src/main.rs"

[workspace]

[lints.clippy]
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
unnecessary_wraps = "warn"
# 想要更严可以加 restriction 的（测试代码里 unwrap 是惯例，需要豁免）：
# unwrap_used = { level = "warn" }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
comfy-table = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"


[profile.release]
strip = true
lto = true
